{{ $brand_icon := resources.Get "media/icon.png" }}

<footer class="rr-footer">
  <div class="rr-footer__inner">
    <div class="rr-footer__top">
      <a class="rr-footer__brand" href="{{ site.Home.RelPermalink }}">
        {{ with $brand_icon }}
          <img src="{{ .RelPermalink }}" width="34" height="34" alt="" loading="lazy" />
        {{ end }}
        <span>
          <strong>红岩博客</strong>
          <small>RedRock Engineering</small>
        </span>
      </a>

      <nav class="rr-footer__nav" aria-label="页脚导航">
        {{ range site.Menus.main }}
          <a href="{{ .URL | relLangURL }}">{{ .Name }}</a>
        {{ end }}
      </nav>
    </div>

    <div class="rr-footer__bottom">
      <span>© {{ now.Year }} RedRock Team. 记录实践，持续分享。</span>
      <a href="https://github.com/RedrockTeam/RedRockBlog" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
    </div>
  </div>
</footer>
