title: Redrock Blog
type: landing

sections:
  - block: hero
    id: section-hero
    content:
      title: "Redrock Blog"
      text: "红岩团队技术博客，收录项目实践、技术笔记与开发记录"
    design:
      size: default
      layout: centered
      alignment: left
      css_class: rr-home-hero

  - block: content-collection
    id: latest-posts
    content:
      count: 3
      filters:
        folders:
          - blog
      archive:
        enable: true
        text: 所有文章
    design:
      view: article-grid
      columns: 2
      css_class: rr-home-section

  - block: content-collection
    id: recent-updates
    content:
      count: 5
      filters:
        folders:
          - log
      archive:
        enable: true
        text: 所有日志
    design:
      view: date-title-summary
      css_class: rr-home-section rr-home-updates
