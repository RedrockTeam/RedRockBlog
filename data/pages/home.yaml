title: 红岩博客
type: landing

sections:
  - block: hero
    content:
      title: "红岩博客"
      text: |
        RedRock 团队的技术博客。多作者、组件化、纯 Markdown 写作。
      primary_action:
        text: "查看博客"
        url: "/blog"
        icon: "hero/arrow-right"
      secondary_action:
        text: "作者简介"
        url: "/authors"
    design:
      css_class: "hero-gradient"
      background:
        gradient:
          start: "primary-600"
          end: "primary-400"
          direction: "135"

  - block: features
    content:
      title: "站点特点"
      items:
        - name: "多作者"
          description: "每个作者都有独立简介页，文章自动聚合"
          icon: "hero/users"
        - name: "组件化"
          description: "区块拼装页面，新增板块不动模板"
          icon: "hero/squares-2x2"
        - name: "GitHub 工作流"
          description: "贡献者只交文章 md，作者档案自动生成"
          icon: "hero/rocket-launch"
    design:
      columns: 3

  - block: collection
    content:
      title: "最新文章"
      count: 5
      filters:
        folders:
          - blog
    design:
      view: article-grid
      columns: 2

  - block: collection
    content:
      title: "最近日志"
      count: 5
      filters:
        folders:
          - log
    design:
      view: date-title-summary
