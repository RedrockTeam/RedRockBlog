baseURL: https://example.org/
title: 红岩博客

defaultContentLanguage: zh
languageCode: zh-CN

enableGitInfo: true

timeZone: Asia/Shanghai

build:
  buildStats:
    enable: true

module:
  imports:
    - path: github.com/HugoBlox/kit/modules/blox
  hugoVersion:
    min: "0.161.1"
    extended: true

taxonomies:
  author: authors
  tag: tags
  category: categories

outputs:
  home: [HTML, RSS, WebAppManifest]

disableAliases: true

markup:
  _merge: deep

security:
  _merge: deep
  exec:
    allow:
      - ^dart-sass-embedded$
      - ^git$
      - ^go$
      - ^node$
      - ^npx$
      - ^tailwindcss$
