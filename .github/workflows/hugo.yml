name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.165.0
      GO_VERSION: '1.26'
      NODE_VERSION: 22
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          lfs: false

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Hugo
        run: |
          curl -sfL --output-dir "${{ runner.temp }}" -O \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "${{ runner.temp }}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
            themes/hugo-blox-builder/node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'package.json', 'themes/hugo-blox-builder/package.json', 'themes/hugo-blox-builder/pnpm-lock.yaml') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Cache Hugo resources
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: hugo-resources-${{ runner.os }}-${{ hashFiles('assets/**', 'layouts/**', 'config/**', 'data/**', 'content/**', 'themes/hugo-blox-builder/modules/**', 'themes/hugo-blox-builder/layouts/**', 'themes/hugo-blox-builder/assets/**', 'go.mod') }}
          restore-keys: |
            hugo-resources-${{ runner.os }}-

      - name: Install JS dependencies
        run: |
          npm install --no-audit --no-fund --prefix themes/hugo-blox-builder
          npm install --no-audit --no-fund

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Generate author profiles (temporary)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 构建前临时生成所有文章引用的作者档案（不入库），确保部署包含作者页
          find content/blog -mindepth 2 -name '*.md' -print > /tmp/blog_files.txt
          python .github/scripts/ensure_authors.py /tmp/blog_files.txt

      - name: Generate author contribution order
        run: python .github/scripts/author_contrib.py

      - name: Generate first-commit dates (temporary)
        run: python .github/scripts/generate_commit_dates.py

      - name: Build
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
        run: |
          hugo build --gc --minify --baseURL "https://blog.redrock.team/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          include-hidden-files: false
          path: ./public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
