name: Mirror friend blogs & deploy

on:
  push:
    branches: ["main"]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-mirror
  cancel-in-progress: true

jobs:
  mirror-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Restore mirror cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: mirror-${{ hashFiles('src/data/channels.json') }}-${{ github.run_id }}
          restore-keys: |
            mirror-${{ hashFiles('src/data/channels.json') }}-
            mirror-

      - name: Mirror and sanitize
        run: node scripts/mirror.mjs

      - name: Build Astro site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
