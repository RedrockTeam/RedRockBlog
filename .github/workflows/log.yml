name: Generate Log Entries from PRs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# 防止多个 PR 合并后并发推送互相冲突
concurrency:
  group: log-sync
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  generate-log:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Collect new commits
        run: |
          BEFORE="${{ github.event.before }}"
          if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then
            # workflow_dispatch 或仓库首次推送：回看最近若干提交
            BEFORE="$(git rev-parse HEAD~10 2>/dev/null || git rev-list --max-parents=0 HEAD | tail -1)"
          fi
          git rev-list "$BEFORE"..HEAD > /tmp/new_commits.txt || true
          echo "new commits: $(wc -l < /tmp/new_commits.txt)"

      - name: Generate log entries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/generate_log.py /tmp/new_commits.txt

      # 分支保护启用后 GITHUB_TOKEN 无法直接推 main，改用 GitHub App token（App 已加入绕过名单）
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: RedrockTeam
          repositories: RedRockBlog

      # 只有合并进 main 之后才生成日志并推回 main；App token 推送会触发工作流，提交消息带 [skip ci] 防止递归
      - name: Commit generated logs to main
        id: commit-logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # 先暂存再判断：git diff 会忽略新生成的未跟踪文件，git add 后 diff --cached 才能发现
          git add content/log
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: 自动生成日志条目（PR 标签 log）[skip ci]"
            git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            # 多个回写工作流并行时可能撞车，失败自动变基重试
            ok=0
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                ok=1
                break
              fi
              echo "第 ${attempt} 次推送失败，2 秒后重试..."
              sleep 2
            done
            if [ "$ok" != "1" ]; then
              echo "连续 5 次推送失败，退出"
              exit 1
            fi
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "无新日志条目，无需提交"
          fi

      # 日志提交本身不会触发新的 workflow run，这里手动调度部署，让日志立即上线
      - name: Trigger deploy
        if: steps.commit-logs.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run hugo.yml --ref main
