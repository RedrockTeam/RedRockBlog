name: Validate friend channels

on:
  pull_request:
    paths:
      - 'src/data/channels.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate channels.json
        run: node scripts/validate-channels.mjs
