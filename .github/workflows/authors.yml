name: Sync Authors from Blog Posts

on:
  pull_request:
    paths:
      - 'content/blog/**'
  push:
    branches:
      - main
    paths:
      - 'content/blog/**'
  workflow_dispatch:

permissions:
  contents: write

# 防止多个 PR 合并后并发推送互相冲突
concurrency:
  group: author-sync
  cancel-in-progress: false

jobs:
  sync-authors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Collect changed blog files
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            git diff --name-only "$BASE"...HEAD -- content/blog > /tmp/changed.txt || true
          else
            BEFORE="${{ github.event.before }}"
            if [[ "$BEFORE" =~ ^0+$ ]]; then
              BEFORE="HEAD~1"
            fi
            git diff --name-only "$BEFORE"...HEAD -- content/blog > /tmp/changed.txt || true
          fi
          echo "changed files: $(wc -l < /tmp/changed.txt)"

      - name: Ensure author profiles
        run: python .github/scripts/ensure_authors.py /tmp/changed.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 分支保护启用后 GITHUB_TOKEN 无法直接推 main，改用 GitHub App token（App 已加入绕过名单）
      - name: Generate app token
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: RedrockTeam
          repositories: RedRockBlog

      # 只有合并进 main 之后才生成档案并推回 main；PR 阶段只校验，不回推分支；提交消息带 [skip ci] 防止递归
      - name: Commit generated profiles to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 目录可能不存在（例如作者被全部删除时），存在才 add，避免 pathspec 报错
          if [ -d data/authors ]; then
            git add data/authors
          fi
          if [ -d assets/media/authors ]; then
            git add assets/media/authors
          fi
          if git diff --cached --quiet; then
            echo "无新档案，无需提交"
            exit 0
          else
            git commit -m "chore: 自动生成作者档案[skip ci]"
            git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            # 多个回写工作流并行时可能撞车，失败自动变基重试
            ok=0
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                ok=1
                break
              fi
              echo "第 ${attempt} 次推送失败，2 秒后重试..."
              sleep 2
            done
            if [ "$ok" != "1" ]; then
              echo "连续 5 次推送失败，退出"
              exit 1
            fi
          fi
