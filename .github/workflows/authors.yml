name: Sync Authors from Blog Posts

on:
  pull_request:
    paths:
      - 'content/blog/**'
  push:
    branches:
      - main
    paths:
      - 'content/blog/**'
  workflow_dispatch:

permissions:
  contents: write

# 防止多个 PR 合并后并发推送互相冲突
concurrency:
  group: author-sync
  cancel-in-progress: false

jobs:
  sync-authors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Collect changed blog files
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            git diff --name-only "$BASE"...HEAD -- content/blog > /tmp/changed.txt || true
          else
            BEFORE="${{ github.event.before }}"
            if [[ "$BEFORE" =~ ^0+$ ]]; then
              BEFORE="HEAD~1"
            fi
            git diff --name-only "$BEFORE"...HEAD -- content/blog > /tmp/changed.txt || true
          fi
          echo "changed files: $(wc -l < /tmp/changed.txt)"

      - name: Ensure author profiles
        run: python .github/scripts/ensure_authors.py /tmp/changed.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 只有合并进 main 之后才生成档案并推回 main；PR 阶段只校验，不回推分支
      - name: Commit generated profiles to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/authors assets/media/authors
          if git diff --cached --quiet; then
            echo "无新档案，无需提交"
            exit 0
          else
            git commit -m "chore: 自动生成作者档案"
            git pull --rebase origin main   # 合并期间 main 有变化就先变基，避免非快进失败
            git push origin HEAD:main
          fi
